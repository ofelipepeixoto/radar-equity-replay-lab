[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-equity-replay-lab"
version = "0.2.0"
description = "Local, deterministic educational replay of synthetic equity prices"
requires-python = ">=3.11"
authors = [{name = "Carlos Felipe"}]
license = {text = "MIT"}
dependencies = []

[project.scripts]
radar-equity-replay = "radar_equity_replay.__main__:main"
radar-equity-workbook = "radar_equity_replay.workbook:main"

[tool.setuptools.packages.find]
where = ["src"]
